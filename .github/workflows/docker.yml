name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: deploy/docker/go.Dockerfile
            service: gateway
            platforms: linux/amd64,linux/arm64
          - name: cachenode
            dockerfile: deploy/docker/go.Dockerfile
            service: cachenode
            platforms: linux/amd64,linux/arm64
          - name: registry
            dockerfile: deploy/docker/go.Dockerfile
            service: registry
            platforms: linux/amd64,linux/arm64
          - name: origin
            dockerfile: deploy/docker/go.Dockerfile
            service: origin
            platforms: linux/amd64,linux/arm64
          # amd64 only: the Go images cross-compile for free, but the trainer installs
          # LightGBM's wheel, and doing that for arm64 means pip under QEMU emulation.
          - name: trainer
            dockerfile: deploy/docker/trainer.Dockerfile
            service: ""
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/belady-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          # Pinned rather than inherited from the repository description. buildx parses
          # the label list as CSV, so a double quote anywhere in it fails every build
          # with "Quote Not Closed" and nothing in the repo explains why.
          labels: |
            org.opencontainers.image.description=A distributed gRPC cache whose eviction policy is a machine-learned approximation of Belady's optimal algorithm.

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          # Pull requests build but do not publish. The build is the useful signal;
          # publishing from an untrusted branch is not.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          # ignore-error because the cache export runs after the manifest is pushed, so
          # a flake in the Actions cache service fails a job whose image already shipped.
          # Seen once as "error writing layer blob: not_found" on the registry image.
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
