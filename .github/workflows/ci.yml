name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOC_VERSION: "35.0"

jobs:
  go:
    name: go build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...

      - run: go vet ./...

      # -race is not optional here: the store is sharded, the trace rings are
      # single-producer by construction, and both properties are invisible without it.
      - run: go test ./... -race -covermode=atomic -coverprofile=coverage.txt

      - name: Coverage summary
        run: go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # These workflows are the one thing in the repo that cannot be tested locally by
      # running it, so the static check is worth more here than anywhere else.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  proto-drift:
    name: generated stubs are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The Makefile pins the plugin versions; protoc itself has to be pinned here,
      # because its version is recorded in the header of every generated file.
      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          sudo install -m 0755 /tmp/protoc/bin/protoc /usr/local/bin/protoc
          protoc --version

      - run: make proto-check

      - run: make -C trainer proto-check

  python:
    name: trainer ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - run: make -C trainer lint

      - run: make -C trainer test

  feature-contract:
    name: feature layout matches the trainer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Called out as its own job because it is the one failure in this repo that is
      # otherwise completely silent: a reordered column trains, loads and evaluates.
      - run: go test ./internal/features -run TestNamesMatchTheTrainer -v

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Scanners float on purpose. Pinning a vulnerability database to a commit is how
      # you end up passing a scan that no longer knows about anything.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -exclude-generated ./...

      - name: pip-audit
        run: make -C trainer audit
