name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: read

jobs:
  binaries:
    name: build and publish binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              for svc in gateway cachenode registry origin loadgen; do
                out="dist/belady-${svc}-${os}-${arch}"
                CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                  -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$out" "./cmd/${svc}"
              done
            done
          done
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${TAG}"
            else
              git log --no-merges --pretty='- %s'
            fi
          } > notes.md
          cat notes.md

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/belady-*

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${TAG}" dist/* --title "${TAG}" --notes-file notes.md --verify-tag
