version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    # gosec runs here rather than as its own binary in CI so that one //nolint:gosec
    # with a reason is enough. The standalone tool ignores nolint and needs #nosec,
    # which means two annotations saying the same thing on the same line.
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars

  settings:
    gosec:
      excludes:
        # G115 flags every narrowing or signedness change. Twenty-one of them here are
        # shard indices, ring capacities, byte counters and tree node offsets, all
        # bounded by values this process chose itself. Auditing them one by one is
        # worth doing; failing the build on all of them teaches people to ignore gosec.
        - G115

    govet:
      enable:
        - fieldalignment # hot-path structs pay for padding

    revive:
      rules:
        # A comment on `func Int(key string, def int) int` adds nothing. Comments
        # here are reserved for behaviour that is not obvious from the signature.
        - name: exported
          disabled: true

  exclusions:
    generated: lax
    # Belt and braces with `generated: lax`. Detecting the header means reading the
    # file, and when that fails protoc's output arrives as a wall of fieldalignment
    # findings against code nobody is allowed to edit by hand.
    paths:
      - gen
    rules:
      # Benchmarks and tests intentionally ignore returns, pack structs loosely, seed
      # their own PRNGs and read fixture files by path.
      - path: _test\.go
        linters:
          - errcheck
          - govet
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen
