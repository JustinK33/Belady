name: belady-min

services:
  cachenode:
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    stop_grace_period: 15s
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE: cachenode
    image: belady/cachenode:dev
    environment:
      GRPC_ADDR: ":8081"
      DEBUG_ADDR: ":9090"
      NODE_ID: cachenode
      CACHE_POLICY: ${CACHE_POLICY:-s3fifo}
      CACHE_SHARDS: ${CACHE_SHARDS:-32}
      CACHE_CAPACITY: ${CACHE_CAPACITY:-64MiB}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks: [belady]

  gateway:
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    stop_grace_period: 15s
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        SERVICE: gateway
    image: belady/gateway:dev
    depends_on:
      - cachenode
    environment:
      GRPC_ADDR: ":8080"
      DEBUG_ADDR: ":9090"
      HTTP_ADDR: ":8090"
      HTTP_AUTH_TOKEN: ${HTTP_AUTH_TOKEN:?set HTTP_AUTH_TOKEN, for example in deploy/.env}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-5s}
      CACHE_NODES: cachenode:8081
      MAX_INFLIGHT: ${MAX_INFLIGHT:-4096}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${GATEWAY_HTTP_PORT:-8090}:8090"
      - "${GATEWAY_PORT:-8080}:8080"
      - "${GATEWAY_DEBUG_PORT:-9090}:9090"
    networks: [belady]

networks:
  belady:
    driver: bridge
